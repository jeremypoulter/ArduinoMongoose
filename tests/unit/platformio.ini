[platformio]
src_dir = ../../src
test_dir = test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=gnu++11
  -I include
  -I ../../src
  --coverage
  -lgcov
  -DMG_TLS=2
  -lssl
  -lcrypto

[env:native_test]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
  https://github.com/bxparks/EpoxyDuino.git#v1.6.0
build_flags =
  -std=gnu++11
  -I include
  -I ../../src

[env:esp32_test]
platform = espressif32
board = esp-wrover-kit
framework = arduino
test_framework = unity
test_build_src = yes
build_flags =
  -std=gnu++11
  -I include
  -I ../../src
