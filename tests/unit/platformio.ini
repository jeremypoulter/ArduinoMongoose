[platformio]
src_dir = ../../src
test_dir = test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=gnu++11
  -I include
  -I ../../src
  --coverage
  -lgcov
  -DMG_TLS=2
  -lssl
  -lcrypto

[env:native_test]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
  https://github.com/jeremypoulter/EpoxyDuino.git#4f3f0db2b9c31656da828f21838d0a30f7417370
build_flags =
  -std=gnu++11
  -I include
  -I ../../src
  -DARDUINO=10800
  -DEPOXY_DUINO
  -DMG_TLS=2
  -lssl
  -lcrypto

[env:esp32_test]
platform = espressif32
board = esp-wrover-kit
framework = arduino
test_framework = unity
test_build_src = yes
build_flags =
  -std=gnu++11
  -I include
  -I ../../src
