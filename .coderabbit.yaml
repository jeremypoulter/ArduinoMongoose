# CodeRabbit configuration
#
# src/mongoose.c and src/mongoose.h are vendored verbatim from
# https://github.com/cesanta/mongoose, and
# .github/workflows/update-mongoose.yml re-downloads both wholesale from
# upstream on every release. Anything written into them here is discarded at
# the next bump, so durable fixes belong in PRs to cesanta/mongoose.
#
# The docstring-coverage check scopes itself to every function a diff
# touches, so a handful of mDNS edits in mongoose.c pull ~20 upstream C
# functions into the denominator and put the 80% threshold out of reach
# without hand-editing vendored code. The check has no path filter of its
# own (reviews.pre_merge_checks.docstrings takes only mode and threshold),
# and reviews.path_filters is not usable here as a substitute: it also
# drives sparse-checkout, so excluding the vendored files would stop
# CodeRabbit reviewing the mDNS changes this repository actually makes to
# them. Code review of mongoose.c is worth more than the coverage metric,
# so the check is disabled and the review left intact.
#
# Header documentation is still expected -- see
# .github/copilot-instructions.md: "Public classes and methods in src/
# headers should include Doxygen comments".
reviews:
  pre_merge_checks:
    docstrings:
      mode: "off"
